{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <h1 class="text-center mb-4">{% block title %} Iniciar Sessão {% endblock %}</h1>

        <form method="post">
            <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" name="username" placeholder="Seu usuário" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" placeholder="Sua senha" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
